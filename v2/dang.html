<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长路</title>
<style>
  :root {
    --ink: #1a1230;
    --paper: #f6f1ea;
    --gold: #f0b7c8;
    --gold2: #8ee0d2;
    --dim: #cbbfd4;
    --ui: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #140c22;
    color: var(--paper);
    font-family: var(--ui);
    overflow: hidden;
  }
  button, input { font-family: inherit; }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
  }
  #frame {
    position: relative;
    width: min(1120px, 100vw, calc((100vh - 92px) * 16 / 9));
    aspect-ratio: 16 / 9;
    background: #07080c;
    box-shadow:
      0 0 0 4px #241838,
      0 0 0 8px #f0a8c4,
      0 18px 50px rgba(0,0,0,.45);
    overflow: hidden;
  }
  canvas {
    width: 100%; height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #hud {
    position: absolute; left: 16px; top: 12px; right: 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 3;
  }
  #chap {
    font-family: var(--ui);
    font-size: clamp(16px, 2vw, 22px);
    font-weight: 700;
    letter-spacing: .08em;
    color: #f6efe2;
    text-shadow: 0 2px 0 #1a1612, 0 0 8px rgba(0,0,0,.8);
  }
  #hint {
    margin-top: 4px;
    font-family: var(--ui);
    font-size: 13px;
    letter-spacing: .08em;
    color: #f0e2bc;
    text-shadow: 0 1px 2px #000;
    min-height: 1.2em;
  }
  #mute {
    pointer-events: auto;
    background: rgba(20,16,14,.55);
    color: var(--gold);
    border: 2px solid var(--gold2);
    width: 36px; height: 36px;
    cursor: pointer;
  }
  #talkbox {
    position: absolute; left: 3.5%; right: 3.5%; bottom: 4%;
    min-height: 26%;
    background: rgba(18, 14, 36, .9);
    border: 3px solid #f0b4cc;
    box-shadow: 0 0 0 3px #241830, 8px 8px 0 rgba(0,0,0,.35);
    padding: 14px 18px 16px 92px;
    z-index: 4;
    display: none;
  }
  #talkbox.show { display: block; }
  #talkbox.noname { padding-left: 18px; }
  #dname {
    font-family: var(--ui);
    font-weight: 700;
    letter-spacing: .06em;
    font-size: 18px;
    min-height: 1.2em;
    margin-bottom: 4px;
  }
  #dtext {
    font-family: var(--ui);
    font-size: clamp(15px, 1.7vw, 20px);
    line-height: 1.65;
    color: #f7f1e6;
  }
  #dnext {
    position: absolute; right: 14px; bottom: 8px;
    color: var(--gold2);
    font-size: 12px;
    letter-spacing: .12em;
    animation: blink 1.1s steps(2) infinite;
  }
  #portrait {
    position: absolute; left: 12px; bottom: 12px;
    width: 68px; height: 68px;
    background: #100e0c;
    border: 2px solid #8c7350;
    image-rendering: pixelated;
    display: none;
  }
  #choices {
    position: absolute; right: 5%; bottom: 33%;
    display: none; flex-direction: column; gap: 8px;
    z-index: 5;
  }
  #choices.show { display: flex; }
  #choices button {
    background: rgba(24,16,40,.94);
    color: var(--paper);
    border: 2px solid var(--gold);
    padding: 10px 16px;
    cursor: pointer;
    text-align: left;
    font-size: 16px;
  }
  #choices button:hover { background: #3a2850; }
  #card, #title, #end {
    position: absolute; inset: 0;
    display: none;
    z-index: 6;
  }
  #card.show, #title.show, #end.show { display: flex; }
  #card {
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(8,8,12,.45);
    text-align: center;
    cursor: pointer;
  }
  #card .kicker {
    letter-spacing: .5em;
    color: var(--gold);
    font-size: 14px;
    margin-bottom: 8px;
  }
  #card h2 {
    font-family: var(--ui);
    font-weight: 700;
    font-size: clamp(36px, 5vw, 64px);
    letter-spacing: .12em;
    margin: 0;
    text-shadow: 0 3px 0 #1a1612;
  }
  #card p { color: #f0e6d4; letter-spacing: .12em; margin-top: 10px; }
  #title {
    align-items: center; justify-content: center;
    background: linear-gradient(to top, rgba(16,10,32,.78), rgba(16,10,32,.12) 52%, rgba(16,10,32,.28));
  }
  #title .panel { width: min(640px, 88%); text-align: center; }
  #title h1 {
    font-family: var(--ui);
    font-weight: 700;
    font-size: clamp(56px, 8vw, 92px);
    letter-spacing: .14em;
    margin: 0;
    text-shadow: 0 3px 0 #241c16, 0 12px 30px rgba(0,0,0,.45);
  }
  #title .for {
    letter-spacing: .28em;
    color: var(--gold);
    margin: 4px 0 18px;
  }
  #title .letter {
    font-family: var(--ui);
    text-align: left;
    line-height: 1.75;
    font-size: clamp(14px, 1.6vw, 17px);
    background: rgba(16,13,11,.62);
    border: 2px solid rgba(240,180,204,.8);
    padding: 14px 16px;
  }
  #title .ops {
    margin-top: 12px;
    color: #d9cbb3;
    font-family: var(--ui);
    font-size: 13px;
    letter-spacing: .04em;
  }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .btn {
    background: #f4d4e2;
    color: #241430;
    border: none;
    padding: 10px 22px;
    font-weight: 700;
    letter-spacing: .08em;
    font-size: 16px;
    cursor: pointer;
  }
  .btn.ghost {
    background: transparent;
    color: var(--gold);
    border: 2px solid var(--gold2);
  }
  #end {
    align-items: flex-end; justify-content: center;
    background: linear-gradient(to top, rgba(7,8,12,.88), rgba(7,8,12,.18));
    padding: 4% 4% 5%;
  }
  #end .panel {
    width: min(760px, 96%);
    background: rgba(18,15,13,.9);
    border: 3px solid #f0b4cc;
    box-shadow: 0 0 0 3px #241830;
    padding: 22px 22px 16px;
  }
  #end h2 {
    font-family: var(--ui);
    font-weight: 700;
    letter-spacing: .1em;
    font-size: 36px;
    margin: 0 0 8px;
  }
  #end p {
    font-family: var(--ui);
    line-height: 1.7;
    margin: 6px 0;
  }
  #timeline {
    display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0;
  }
  #timeline span {
    border: 1px solid #a888b0;
    padding: 4px 8px;
    font-size: 13px;
    letter-spacing: .06em;
    color: #f0e2bc;
  }
  #credits {
    color: #cbbfa6;
    font-size: 13px;
    letter-spacing: .12em;
  }
  #pad {
    display: none;
    gap: 8px;
    width: min(1120px, 100%);
    justify-content: space-between;
  }
  #pad button {
    flex: 1;
    background: #2a241c;
    color: var(--gold);
    border: 2px solid var(--gold2);
    padding: 12px 0;
    font-size: 16px;
    letter-spacing: .12em;
  }
  @media (pointer: coarse), (max-width: 800px) {
    #pad { display: flex; }
  }
  @keyframes blink { 50% { opacity: .2; } }
</style>
</head>
<body>
<div id="app">
  <div id="frame">
    <canvas id="c" width="960" height="540"></canvas>
    <div id="hud">
      <div>
        <div id="chap"></div>
        <div id="hint"></div>
      </div>
      <button id="mute" type="button" title="音乐">♪</button>
    </div>
    <canvas id="portrait" width="48" height="48"></canvas>
    <div id="talkbox">
      <div id="dname"></div>
      <div id="dtext"></div>
      <div id="dnext">点击继续</div>
    </div>
    <div id="choices"></div>
    <div id="card">
      <div class="kicker" id="cardK"></div>
      <h2 id="cardT"></h2>
      <p id="cardS"></p>
    </div>
    <div id="title" class="show">
      <div class="panel">
        <h1>长路</h1>
        <div class="for">给当当</div>
        <div class="letter">
          当当：从教室走到灯下，你都认真。<br>
          这个小人会沿着你的这些年往前走。<br>
          最后一段未来，是朋友替你先看的一眼。不是催促，是给你留的灯。
        </div>
        <div class="ops">← → 或 A D 行走 · ↑ 跳跃 · 空格 / Z 对话 · Shift 走快一点 · M 音乐</div>
        <div class="row">
          <button class="btn" id="start" type="button">开始走</button>
          <button class="btn ghost" id="cont" type="button" style="display:none">接着走</button>
        </div>
      </div>
    </div>
    <div id="end">
      <div class="panel">
        <h2 id="endTitle">灯还亮着</h2>
        <p id="endBody"></p>
        <div id="timeline"></div>
        <p id="credits"></p>
        <div class="row">
          <button class="btn" id="again" type="button">再走一次</button>
        </div>
      </div>
    </div>
  </div>
  <div id="pad">
    <button type="button" data-k="left">向左</button>
    <button type="button" data-k="right">向右</button>
    <button type="button" data-k="jump">跳</button>
    <button type="button" data-k="act">对话</button>
  </div>
</div>
<script>
"use strict";
const VW = 480, VH = 270, S = 2, GROUND = 232;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const portrait = document.getElementById("portrait");
const pctx = portrait.getContext("2d");

const COL = {
  skin: "#f0c7a4", skin2: "#e3b18f", hair: "#241c18",
  ink: "#1c1814", white: "#f4f1ea", navy: "#243656",
  red: "#b83b3b", gold: "#e2b656", grass: "#5f9348",
  dirt: "#8d6b43", leaf: "#3f7a43", bark: "#6b4630"
};

const OUTFITS = {
  school: { top: "#f7f4ee", bottom: "#2a3d66", shoes: "#2b2b33", band: true },
  home: { top: "#d7c4a3", bottom: "#3e4654", shoes: "#2b2b33" },
  police: { top: "#1e3358", bottom: "#17243d", shoes: "#141820", cap: true, badge: true, shirt: "#d5e4f2" }
};

const G = {
  mode: "title",
  sceneIndex: 0,
  cam: 0,
  time: 0,
  music: true,
  player: { x: 80, feet: GROUND, vy: 0, vx: 0, dir: 1, on: true, outfit: "school" },
  dog: { on: false, x: 40, dir: 1, grown: false },
  flags: { beck: false },
  npcs: [],
  queue: [],
  line: null,
  shown: "",
  full: "",
  typeT: 0,
  items: [],
  parts: [],
  floats: [],
  afterTalk: null,
  choice: null,
  fade: 0,
  fadeTo: null,
  cardTimer: 0,
  hold: {},
  anim: 0,
  puppyX: 640,
  fiveGone: false,
  revealed: { tao: false, old: false }
};

const down = {};
const once = {};
addEventListener("keydown", (e) => {
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  down[e.code] = true;
  once[e.code] = true;
  if (e.code === "KeyM") toggleMusic();
});
addEventListener("keyup", (e) => { down[e.code] = false; });

document.getElementById("pad").addEventListener("pointerdown", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  e.preventDefault();
  G.hold[b.dataset.k] = true;
  if (b.dataset.k === "act" || b.dataset.k === "jump") once["Pad" + b.dataset.k] = true;
});
addEventListener("pointerup", () => { G.hold = {}; });
addEventListener("pointercancel", () => { G.hold = {}; });

function consume(codes) {
  for (const c of codes) if (once[c]) { once[c] = false; return true; }
  return false;
}
function holding(side) {
  if (side === "left") return down.ArrowLeft || down.KeyA || G.hold.left;
  if (side === "right") return down.ArrowRight || down.KeyD || G.hold.right;
  return false;
}
function wantJump() { return consume(["ArrowUp", "KeyW", "KeyK", "Padjump"]); }
function wantAct() { return consume(["Space", "Enter", "KeyZ", "KeyJ", "Padact"]); }

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function hash(n) {
  n = Math.imul(n | 0, 374761393);
  n = (n ^ (n >>> 13)) | 0;
  n = Math.imul(n, 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function lerp(a, b, t) { return a + (b - a) * t; }
function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mix(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  const c = A.map((v, i) => (v + (B[i] - v) * t) | 0);
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

const bgm = new Audio("bgm.mp3");
bgm.loop = true;
bgm.volume = 0.48;
bgm.preload = "auto";
function playBgm() {
  if (!G.music) return;
  const pending = bgm.play();
  if (pending && pending.catch) pending.catch(() => {});
}
function toggleMusic() {
  G.music = !G.music;
  document.getElementById("mute").textContent = G.music ? "♪" : "×";
  if (G.music) playBgm();
  else bgm.pause();
}

function current() { return SCENES[G.sceneIndex]; }

function say(lines, after) {
  G.queue.push(...lines);
  if (after) G.afterTalk = after;
  if (G.mode === "play" || G.mode === "card") openLine();
}
function openLine() {
  if (!G.queue.length) {
    G.mode = "play";
    hideTalk();
    const fn = G.afterTalk;
    G.afterTalk = null;
    if (fn) fn();
    return;
  }
  G.mode = "talk";
  G.line = G.queue.shift();
  G.full = G.line.text;
  G.shown = "";
  G.typeT = 0;
  const box = document.getElementById("talkbox");
  box.classList.add("show");
  box.classList.toggle("noname", !G.line.who);
  const nameEl = document.getElementById("dname");
  nameEl.textContent = G.line.name || "";
  nameEl.style.color = G.line.color || "#e6d3a3";
  document.getElementById("dtext").textContent = "";
  if (G.line.who) {
    portrait.style.display = "block";
    drawPortrait(G.line.who);
  } else {
    portrait.style.display = "none";
  }
}
function hideTalk() {
  document.getElementById("talkbox").classList.remove("show");
  portrait.style.display = "none";
  document.getElementById("choices").classList.remove("show");
}
function advanceTalk() {
  if (G.mode !== "talk") return;
  if (G.shown.length < G.full.length) { G.shown = G.full; document.getElementById("dtext").textContent = G.full; return; }
  if (G.line && G.line.choice) { showChoice(G.line.choice); return; }
  openLine();
}
function showChoice(choice) {
  const box = document.getElementById("choices");
  box.innerHTML = "";
  box.classList.add("show");
  choice.options.forEach((op) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = op.label;
    b.onclick = () => {
      box.classList.remove("show");
      G.mode = "play";
      hideTalk();
      say(op.lines, op.after || null);
    };
    box.appendChild(b);
  });
}

function N(name, text, who, color) { return { name, text, who, color }; }
const 旁白 = (t) => N("旁白", t, null, "#e6d3a3");
const 当当 = (t) => N("当当", t, "dang", "#f2d48a");
const 问号 = (t, who) => N("？？？", t, who, "#c5cbe8");

const SCENES = [
  {
    id: "front", title: "前排的光", kicker: "壹",
    sub: "名字写在前面的那些早晨",
    w: 1680, outfit: "school", weather: "dust",
    sky: ["#f6c98a", "#f8e2bc", "#8ec8e6"], ground: "grass",
    props: [
      { t: "hill", c: "#8fb56a", y: 150, a: 26 },
      { t: "sun", x: 1380, y: 54 },
      { t: "school", x: 180 },
      { t: "tree", x: 70, r: 26 },
      { t: "tree", x: 620, r: 30, fruit: true },
      { t: "tree", x: 980, r: 22 },
      { t: "tree", x: 1500, r: 28 },
      { t: "bench", x: 760 },
      { t: "board", x: 860 },
      { t: "flower", x: 120 }, { t: "flower", x: 700 }, { t: "flower", x: 1040 },
      { t: "flag", x: 250 }
    ],
    lamps: [],
    signs: [{ text: "光荣榜", x: 902, y: 144, size: 16, c: "#f8f1de" }],
    watchers: [{ who: "old", x: 560, feet: 96 }],
    companions: [],
    interacts: [
      { id: "band", x: 790, hint: "袖标", lines: [旁白("班长的袖标有一点旧。他把它戴正。有人迟到的时候，他会在门口多等一等。")], item: "袖标" }
    ],
    triggers: [
      { x: 220, lines: [旁白("那时候，当当的名字经常写在前排。不是一夜之间的事，是很多个早晨，他自己走到教室里。")] },
      { x: 430, lines: [问号("嗯。眼睛还清。", "old"), 旁白("教学楼高处有个老头，风把他的衣角掀起来。他不下来，也不说自己是谁。")] },
      { x: 560, lines: [旁白("他当班长。收作业，擦黑板，在门口等迟到的人。级部里，他的名字也常常靠前。")] },
      { x: 980, lines: [旁白("也有女生悄悄喜欢他。喜欢一个认真的人，在那个年纪里，是很干净的光。")] },
      { x: 1500, lines: [旁白("路还长。当时的他不知道，长会是什么样子。")] }
    ]
  },
  {
    id: "together", title: "并肩的人", kicker: "贰",
    sub: "游戏，图书馆，课外班，还有一句话",
    w: 2680, outfit: "school", weather: "dust",
    sky: ["#f0b56a", "#f7d7a4", "#7eb0d4"], ground: "path",
    props: [
      { t: "hill", c: "#d7b07a", y: 156, a: 18 },
      { t: "sun", x: 2100, y: 62 },
      { t: "shop", x: 160, name: "游戏厅" },
      { t: "tree", x: 430, r: 24 },
      { t: "library", x: 560 },
      { t: "bench", x: 980 },
      { t: "lamppost", x: 1100 },
      { t: "cram", x: 1280 },
      { t: "tree", x: 1680, r: 26 },
      { t: "lamppost", x: 1900 },
      { t: "house", x: 2100 },
      { t: "tree", x: 2480, r: 20 },
      { t: "bike", x: 400 }
    ],
    signs: [
      { text: "游戏厅", x: 250, y: 156, size: 16, c: "#fff4d2" },
      { text: "图书馆", x: 690, y: 148, size: 16, c: "#6b3a2a" },
      { text: "课外班", x: 1390, y: 156, size: 16, c: "#6b3a2a" }
    ],
    watchers: [{ who: "young", x: 1080, feet: GROUND }],
    companions: [
      { id: "xu", who: "xu", x0: 0, x1: 2140, dx: -42 },
      { id: "li", who: "li", x0: 0, x1: 2180, dx: -78 },
      { id: "l", who: "l", x0: 1500, x1: 1960, dx: 40 }
    ],
    interacts: [
      { id: "console", x: 300, hint: "看一看", lines: [N("李先生", "再来一把。写完作业再来。好吧，来一把再写。", "li", "#f0c59a"), N("徐先生", "你每次都是这么谈判成功的。", "xu", "#a9d6c2")] }
    ],
    triggers: [
      { x: 260, lines: [旁白("初中。徐先生，李先生，是可以一起吵、也可以一起静下来的人。")] },
      { x: 520, lines: [N("徐先生", "图书馆占座了。靠窗。你别又把演算纸画成地图。", "xu", "#a9d6c2"), N("李先生", "那是战术图。", "li", "#f0c59a")] },
      { x: 860, lines: [旁白("他们一起打游戏，一起在图书馆写作业，一起赶课外班。路灯、包子、还没写完的题，把三个人的放学装满。")] },
      { x: 1040, lines: [问号("你们走得挺齐。", "young")] },
      { x: 1320, lines: [N("徐先生", "这题的最后一步，你昨天不是会吗。", "xu", "#a9d6c2"), 旁白("他们都是名列前茅的学生。不是用来比较的，是用来并肩的。")] },
      { x: 1680, lines: [
        N("L", "当当，我喜欢你。不是突然喜欢的。是一起往前走的时候，喜欢上的。", "l", "#f0b7c4"),

function addItem(name) {
  if (!G.items.includes(name)) G.items.push(name);
}
function puff(text, x, y) { G.floats.push({ text, x, y, life: 1 }); }
function burst(x, y, color) {
  for (let i = 0; i < 18; i++) {
    G.parts.push({
      x, y, vx: (Math.random() - 0.5) * 1.4, vy: -Math.random() * 1.6,
      life: 1, kind: "spark", c: color, g: 0.03
    });
  }
}

function bake(sc) {
  if (sc.near) return;
  const far = document.createElement("canvas");
  far.width = sc.w; far.height = VH;
  paintFar(far.getContext("2d"), sc);
  const near = document.createElement("canvas");
  near.width = sc.w; near.height = VH;
  const ng = near.getContext("2d");
  for (const p of sc.props) if (p.t !== "sun" && p.t !== "moon" && p.t !== "mound") drawProp(ng, p, sc);
  drawGround(ng, sc);
  for (const p of sc.props) if (p.t === "mound") drawProp(ng, p, sc);
  paintSigns(ng, sc);
  sc.far = far;
  sc.near = near;
}
function paintFar(g, sc) {
  if (sc.room) drawRoom(g, sc);
  else if (sc.ground === "seasons") drawSeasonBackdrop(g, sc.w);
  else {
    drawSky(g, sc);
    drawFar(g, sc);
  }
  for (const p of sc.props) {
    if (p.t === "sun") sun(g, p.x, p.y);
    else if (p.t === "moon") moon(g, p.x, p.y);
  }
}
function paintSigns(g, sc) {
  g.textAlign = "center";
  g.textBaseline = "middle";
  for (const s of sc.signs || []) {
    g.font = `${s.size || 16}px "Microsoft YaHei", "PingFang SC", sans-serif`;
    g.fillStyle = "rgba(20,16,12,.45)";
    g.fillText(s.text, s.x + 1, s.y + 1);
    g.fillStyle = s.c || "#f8f1de";
    g.fillText(s.text, s.x, s.y);
  }
}

function drawHuman(worldX, feet, dir, frame, look, blink) {
  const sca = look.sc || 1;

  const walk = frame % 4;

  const edge = "#2a241c";
  function block(x, y, w, h, fill) {
    ctx.fillStyle = edge;
    ctx.fillRect(x - 1, y - 1, w + 2, h + 2);

    ctx.fillRect(x, y, w, h);
  }
  ctx.fillStyle = "rgba(40,30,20,.18)";

  }
  block(-12, -30 + bob, 4, 11, look.top);
  block(-7 + leg, -15, 5, 12, look.bottom);
  block(2 - leg, -15, 5, 12, look.bottom);
  block(-8 + leg, -5, 6, 3, look.shoes);
  block(1 - leg, -5, 6, 3, look.shoes);
  block(-8, -32 + bob, 16, 18, look.top);
  if (look.shirt) {

  block(8, -30 + bob, 4, 11, look.skin);

  block(-2, -36 + bob, 4, 4, look.skin);
  block(-7, -50 + bob, 14, 14, look.skin);
  ctx.fillStyle = "#f0a0a0";
  ctx.fillRect(-6, -42 + bob, 2, 1);

      ctx.fillRect(-1, -53 + bob, 3, 2);
    }
    ctx.fillStyle = look.hair;
    ctx.fillRect(-7, -49 + bob, 14, 3);
  } else {
    block(-8, -54 + bob, 16, 6, look.hair);
    ctx.fillStyle = look.hair;
    ctx.fillRect(-8, -49 + bob, 3, 6);
    if (look.cowlick) {
      ctx.fillStyle = "#e2b656";

    if (look.ribbon) {

    ctx.fillRect(-4, -45 + bob, 1, 1);

function spawnWeather(sc) {
  if (G.parts.length > 80) return;
  const x = G.cam + Math.random() * VW;
  if (sc.weather === "paper") {
    G.parts.push({ x, y: 40, vx: 0.4, vy: 0.45, life: 1, kind: "paper", c: "#f4f1ea" });
  } else if (sc.weather === "dust" && Math.random() < 0.3) {
    G.parts.push({ x: G.player.x, y: GROUND - 4, vx: -G.player.dir * 0.3, vy: -0.2, life: 0.6, kind: "dust", c: "rgba(90,70,40,.4)" });
  } else if (sc.weather === "mote" && Math.random() < 0.4) {
    G.parts.push({ x, y: 80 + Math.random() * 100, vx: 0.05, vy: -0.08, life: 1, kind: "dust", c: "rgba(255,220,160,.7)" });
  } else if (sc.weather === "seasons") {
    const px = G.player.x;
    if (px < 720 && Math.random() < 0.5) G.parts.push({ x, y: 30, vx: 0.25, vy: 0.3, life: 1, kind: "paper", c: "#f7b7c4" });
    else if (px >= 1360 && px < 2060 && Math.random() < 0.6) G.parts.push({ x, y: 20, vx: 0.35, vy: 0.4, life: 1, kind: "paper", c: hash(x | 0) > 0.5 ? "#e2b322" : "#c4642a" });
    else if (px >= 2060) G.parts.push({ x, y: -4, vx: 0.15, vy: 0.55, life: 1, kind: "paper", c: "#fff" });
    else if (Math.random() < 0.3) G.parts.push({ x, y: 150, vx: 0, vy: -0.15, life: 0.8, kind: "spark", c: "#ffe08a", g: -0.002 });
  }
}
function updateParts(step) {
  spawnWeather(current());
  for (const p of G.parts) {
    p.x += p.vx * step;
    p.y += p.vy * step;
    p.vy += (p.g || 0) * step;
    p.life -= 0.008 * step;
  }
  G.parts = G.parts.filter((p) => p.life > 0 && p.y < VH + 10);
  for (const f of G.floats) {
    f.y -= 0.25 * step;
    f.life -= 0.015 * step;
  }
  G.floats = G.floats.filter((f) => f.life > 0);
}

function enter(i, withCard) {
  G.sceneIndex = i;
  const sc = current();
  bake(sc);
  G.player.x = 70;
  G.player.feet = GROUND;
  G.player.vy = 0;
  G.player.outfit = sc.outfit;
  G.player.dir = 1;
  G.cam = 0;
  G.dog.on = ["five", "lamp", "future", "desk"].includes(sc.id) || (sc.id === "years" && G.flags.beck);
  G.dog.x = G.player.x - 30;
  G.dog.dir = 1;
  G.npcs = (sc.companions || []).map((c) => ({ ...c, x: c.x0 + c.dx, dir: 1, leaving: false, vx: 0 }));
  sc.triggers.forEach((t) => { t.fired = false; });
  (sc.interacts || []).forEach((t) => { t.used = false; });
  if (sc.id !== "five") G.fiveGone = false;
  if (G.music && bgm.paused) playBgm();
  try { localStorage.setItem("changlu-scene", String(i)); } catch (e) {}
  document.getElementById("chap").textContent = sc.kicker + "  " + sc.title;
  if (withCard) openCard();
  else { G.mode = "play"; G.fade = 1; G.fadeTo = "in"; }
}
function openCard() {
  const sc = current();
  document.getElementById("cardK").textContent = sc.kicker;
  document.getElementById("cardT").textContent = sc.title;
  document.getElementById("cardS").textContent = sc.sub;
  document.getElementById("card").classList.add("show");
  G.mode = "card";
  G.cardTimer = 150;
  G.fade = 0;
}
function closeCard() {
  document.getElementById("card").classList.remove("show");
  G.mode = "play";
}

function checkTriggers() {
  const sc = current();
  for (const t of sc.triggers) {
    if (!t.fired && G.player.x >= t.x) {
      t.fired = true;
      if (t.on) t.on();
      if (t.item) addItem(t.item);
      if (t.choice) {
        const lines = t.lines.map((l, idx) => idx === t.lines.length - 1 ? { ...l, choice: t.choice } : l);
        say(lines);
        return;
      }
      if (t.lines) { say(t.lines); return; }
    }
  }
  const last = sc.triggers[sc.triggers.length - 1];
  if (last && last.fired && !G.queue.length && G.mode === "play" && G.player.x > sc.w - 80) {
    if (G.sceneIndex >= SCENES.length - 1) startEnd();
    else enter(G.sceneIndex + 1, true);
  }
}
function nearestInteract() {
  const sc = current();
  let best = null, bd = 42;
  for (const it of sc.interacts || []) {
    if (it.used) continue;
    const d = Math.abs(G.player.x - it.x);
    if (d < bd) { bd = d; best = it; }
  }
  return best;
}
function doInteract() {
  const it = nearestInteract();
  if (!it) return false;
  it.used = true;
  if (it.item) addItem(it.item);
  say(it.lines);
  return true;
}

function updatePlayer(step) {
  const sc = current();
  let dir = 0;
  if (holding("left")) dir -= 1;
  if (holding("right")) dir += 1;
  const fast = down.ShiftLeft || down.ShiftRight ? 1.75 : 1;
  const slow = sc.id === "heavy" ? 0.82 : 1;
  const spd = 1.2 * fast * slow;
  G.player.vx = dir * spd;
  if (dir) G.player.dir = dir;
  G.player.x = clamp(G.player.x + G.player.vx * step, 36, sc.w - 36);
  if (wantJump() && G.player.on) G.player.vy = -4.7;
  G.player.vy += 0.22 * step;
  G.player.feet += G.player.vy * step;
  if (G.player.feet >= GROUND) {
    G.player.feet = GROUND;
    G.player.vy = 0;
    G.player.on = true;
  } else G.player.on = false;
  if (Math.abs(G.player.vx) > 0.2 && G.player.on) G.anim += step;
  const it = nearestInteract();
  const last = sc.triggers[sc.triggers.length - 1];
  const hint = it
    ? "空格 / Z  ·  " + it.hint
    : (last && last.fired && G.player.x > sc.w - 260 ? "继续向右" : "");
  document.getElementById("hint").textContent = hint;
  if (wantAct()) doInteract();
}
function updateNpcs(step) {
  const px = G.player.x;
  for (const n of G.npcs) {
    if (n.leaving) {
      n.x += (n.vx || -0.6) * step;
      n.dir = -1;
      continue;
    }
    let desired;
    if (px < n.x0) desired = n.x0;
    else if (px > n.x1) desired = n.x1 + (n.dx || 0);
    else desired = px + n.dx;
    const prev = n.x;
    n.x += (desired - n.x) * Math.min(1, 0.12 * step);
    n.dir = n.x < prev - 0.01 ? -1 : 1;
  }
  const l = G.npcs.find((n) => n.id === "l");
  const trig = current().triggers.find((t) => t.x === 1680);
  if (l && trig && trig.fired) l.leaving = true;
}
function updateDog(step) {
  const sc = current();
  if (sc.id === "years" && !G.flags.beck) {
    G.puppyX = 620 + Math.sin(G.time * 0.05) * 70;
    return;
  }
  if (!G.dog.on) return;
  const target = G.player.x - 34 * G.player.dir;
  const prev = G.dog.x;
  const delta = target - G.dog.x;
  G.dog.x += clamp(delta, -1.8, 1.8) * step * (Math.abs(delta) > 50 ? 1.3 : 0.9);
  if (Math.abs(delta) > 0.5) G.dog.dir = delta > 0 ? 1 : -1;
  else G.dog.dir = prev <= G.dog.x ? 1 : -1;
}
function updateCam() {
  const sc = current();
  const target = clamp(G.player.x - 180, 0, Math.max(0, sc.w - VW));
  G.cam += (target - G.cam) * 0.12;
}

function frameOf(moving) {
  if (!moving) return 0;
  return Math.floor(G.anim / 7) % 4;
}
function blinkNow() { return Math.floor(G.time) % 170 < 7; }

function render() {
  const sc = current();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#07080c";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!sc || !sc.near) return;
  const cam = Math.round(G.cam);
  const farCam = sc.room ? cam : Math.round(Math.min(cam * 0.62, sc.w - VW));
  ctx.drawImage(sc.far, farCam, 0, VW, VH, 0, 0, VW * S, VH * S);
  ctx.drawImage(sc.near, cam, 0, VW, VH, 0, 0, VW * S, VH * S);
  drawDynamic(sc, cam);
  vignette();
  if (G.fade > 0.01) {
    ctx.fillStyle = `rgba(7,8,12,${G.fade})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}
function drawDynamic(sc, cam) {
  G.cam = cam;
  beginWorld();
  if (sc.id === "front") drawFlag(250, GROUND - 130);
  for (const lamp of sc.lamps || []) {
    const flick = 0.55 + Math.sin(G.time * 0.2 + lamp.x) * 0.08;
    glow(lamp.x, lamp.y, sc.id === "heavy" && lamp.x > 1200 ? 70 : 36, `rgba(255,196,110,${flick})`);
  }
  if (sc.id === "five" && !G.fiveGone) drawFive(1040, GROUND - 78);
  if (sc.id === "heavy") {
    glow(sc.w - 97, GROUND - 40, 50, "rgba(255,196,120,.85)");
  }
  endWorld();

  const blink = blinkNow();
  for (const w of sc.watchers || []) {
    const look = lookOf(w.who);
    if (w.sc) look.sc = w.sc;
    const bob = Math.sin(G.time * 0.08 + w.x) > 0.2 ? 1 : 0;
    drawHuman(w.x, w.feet + bob, w.x > G.player.x ? -1 : 1, 0, look, blink);
    const tagY = (w.sc || 1) < 0.7 ? w.feet - 24 : w.feet - 64;
    if (sc.id === "desk" && w.who === "young" && G.revealed.tao) label(w.x, tagY, "涛涛");
    if (sc.id === "desk" && w.who === "old" && G.revealed.old) label(w.x, tagY, "怪老头");
  }
  for (const n of G.npcs) {
    if (n.x < G.cam - 40 || n.x > G.cam + VW + 40) continue;
    const moving = Math.abs(n.x - (n._px || n.x)) > 0.2;
    n._px = n.x;
    drawHuman(n.x, GROUND, n.dir, frameOf(moving), lookOf(n.who), blink);
    const tag = n.who === "xu" ? "徐先生" : n.who === "li" ? "李先生" : n.who === "l" ? "L" : "";
    if (tag && !n.leaving) label(n.x, GROUND - 78, tag);
  }
  if (sc.id === "future" && G.player.x > 1700 && G.player.x < 2100) {
    drawHuman(1760, GROUND, -1, 0, lookOf("passer"), blink);
  }
  if (sc.id === "years" && !G.flags.beck) {
    drawDog(G.puppyX, GROUND, Math.sin(G.time * 0.05) > 0 ? 1 : -1, frameOf(true), 0.55);
  }
  if (G.dog.on) {
    const moving = Math.abs(G.dog.x - (G.dog._px || 0)) > 0.3;
    G.dog._px = G.dog.x;
    const scale = dogScale();
    drawDog(G.dog.x, GROUND, G.dog.dir, frameOf(moving), scale);
    if (sc.id !== "lamp") label(G.dog.x, GROUND - 28 * scale - 10, "贝克");
  }
  const pm = Math.abs(G.player.vx) > 0.2 && G.player.on;
  drawHuman(Math.round(G.player.x), Math.round(G.player.feet), G.player.dir, frameOf(pm), applyOutfit(lookOf("dang"), G.player.outfit), blink);

  beginWorld();
  for (const p of G.parts) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x, p.y, p.kind === "paper" ? 3 : 2, p.kind === "paper" ? 2 : 2);
  }
  ctx.globalAlpha = 1;
  endWorld();
  for (const f of G.floats) {
    worldText(f.text, f.x, f.y, 20, `rgba(255,244,220,${clamp(f.life,0,1)})`);
  }
  birds(sc);
}
function dogScale() {
  const sc = current();
  if (sc.id === "years") return 0.55 + clamp(G.player.x / sc.w, 0, 1) * 0.35;
  if (sc.id === "five") return 0.95;
  if (sc.id === "lamp" || sc.id === "desk") return 1;
  return 1.15;
}
function beginWorld() {
  ctx.save();
  ctx.setTransform(S, 0, 0, S, -Math.round(G.cam) * S, 0);
}
function endWorld() { ctx.restore(); }
function glow(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 2, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function drawFlag(x, y) {
  ctx.fillStyle = "#d9d3c5";
  ctx.fillRect(x, y, 2, 70);
  const wave = Math.sin(G.time * 0.15) * 2;
  ctx.fillStyle = "#c23b3b";
  ctx.fillRect(x + 2, y + 4 + wave, 18, 12);
  ctx.fillStyle = "#f2d15a";
  ctx.fillRect(x + 6, y + 8 + wave, 3, 3);
}
function drawFive(x, y) {
  const rows = ["111111", "11....", "11111.", "....11", "11111."];
  glow(x + 16, y + 16, 42, "rgba(243,212,138,.55)");
  rows.forEach((row, iy) => {
    for (let ix = 0; ix < row.length; ix++) {
      if (row[ix] === "1") {
        ctx.fillStyle = "#2a2118";
        ctx.fillRect(x + ix * 6 - 1, y + iy * 6 - 1, 6, 6);
        ctx.fillStyle = "#f3d48a";
        ctx.fillRect(x + ix * 6, y + iy * 6, 4, 4);
      }
    }
  });
}
function label(x, y, text) {
  worldText(text, x, y, 14, "#f7f1e4");
}
function worldText(text, x, y, size, color) {
  ctx.save();
  ctx.font = `${size}px "Microsoft YaHei", "PingFang SC", sans-serif`;
  ctx.fillStyle = "rgba(0,0,0,.55)";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, (x - G.cam) * S + 1, y * S + 1);
  ctx.fillStyle = color;
  ctx.fillText(text, (x - G.cam) * S, y * S);
  ctx.restore();
}
function birds(sc) {
  if (sc.room || sc.stars || sc.id === "heavy") return;
  ctx.save();
  ctx.setTransform(S, 0, 0, S, 0, 0);
  for (let i = 0; i < 4; i++) {
    const x = ((G.time * 0.6 + i * 90) % (VW + 30)) - 10;
    const y = 28 + i * 10;
    ctx.strokeStyle = "#2a241c";
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 4, y - 2);
    ctx.lineTo(x + 8, y);
    ctx.stroke();
  }
  ctx.restore();
}
function vignette() {
  const g = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.width * 0.28, canvas.width / 2, canvas.height / 2, canvas.width * 0.62);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,.38)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function startEnd() {
  G.mode = "end";
  const timeline = document.getElementById("timeline");
  const base = ["前排的光", "并肩", "停下来", "贝克", "五分", "灯下", "未来", "书桌"];
  timeline.innerHTML = "";
  base.forEach((name) => {
    const s = document.createElement("span");
    s.textContent = name;
    timeline.appendChild(s);
  });
  G.items.forEach((name) => {
    const s = document.createElement("span");
    s.textContent = name;
    timeline.appendChild(s);
  });
  document.getElementById("endBody").innerHTML = "差的那五分，已经走在后面了。前面是新疆政法学院的国安学，是你想为之尽责的人，也是还亮着的这盏灯。<br>当当，去备考。去明年的考场。我们在旁边。";
  document.getElementById("credits").textContent = "路是当当的。怪老头负责在风里看一眼。涛涛把这段路做成了可以走的样子。";
  document.getElementById("end").classList.add("show");
  document.getElementById("chap").textContent = "给当当";
  try { localStorage.removeItem("changlu-scene"); } catch (e) {}
}

function update(step) {
  G.time += step;
  if (G.mode === "title") {
    G.cam = (Math.sin(G.time * 0.004) * 0.5 + 0.5) * 400;
    G.fade = 0;
    return;
  }
  if (G.fadeTo === "in") {
    G.fade = Math.max(0, G.fade - 0.03 * step);
    if (G.fade === 0) G.fadeTo = null;
  }
  if (G.mode === "card") {
    G.cardTimer -= step;
    if (G.cardTimer <= 0) closeCard();
    updateParts(step);
    return;
  }
  if (G.mode === "end") return;
  const talking = G.mode === "talk";
  if (!talking) updatePlayer(step);
  else {
    G.player.vx = 0;
    if (wantAct()) advanceTalk();
  }
  updateNpcs(step);
  updateDog(step);
  updateParts(step);
  updateCam();
  if (talking) {
    if (G.shown.length < G.full.length) {
      G.typeT += step * 0.55;
      const n = Math.min(G.full.length, 1 + (G.typeT | 0));
      if (n !== G.shown.length) {
        G.shown = G.full.slice(0, n);
        document.getElementById("dtext").textContent = G.shown;
      }
    }
  } else checkTriggers();
}

let titleBake = null;
function ensureTitle() {
  if (titleBake) return;
  titleBake = document.createElement("canvas");
  titleBake.width = 1400;
  titleBake.height = VH;
  const g = titleBake.getContext("2d");
  drawSky(g, { w: 1400, sky: ["#f2b27a", "#f7e1b8", "#7ec0ea"], stars: false });
  drawFar(g, { w: 1400, stars: false });
  poplars(g, 1400, GROUND);
  drawGround(g, { w: 1400, ground: "poplar" });
}
function renderTitle() {
  ensureTitle();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const cam = Math.round(G.cam);
  ctx.drawImage(titleBake, cam, 0, VW, VH, 0, 0, VW * S, VH * S);
  vignette();
}

let last = performance.now();
function loop(now) {
  const step = clamp((now - last) / 16.67, 0.5, 2);
  last = now;
  if (G.mode === "title") {
    update(step);
    renderTitle();
  } else {
    update(step);
    render();
  }
  requestAnimationFrame(loop);
}

document.getElementById("start").onclick = () => beginGame(0);
document.getElementById("cont").onclick = () => {
  let i = 0;
  try { i = parseInt(localStorage.getItem("changlu-scene") || "0", 10) || 0; } catch (e) {}
  beginGame(clamp(i, 0, SCENES.length - 1));
};
document.getElementById("again").onclick = () => {
  G.flags.beck = false;
  G.items = [];
  G.revealed = { tao: false, old: false };
  document.getElementById("end").classList.remove("show");
  beginGame(0);
};
document.getElementById("card").onclick = () => { if (G.mode === "card") closeCard(); };
document.getElementById("talkbox").onclick = () => advanceTalk();
document.getElementById("mute").onclick = () => toggleMusic();
addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (G.mode === "title" && (e.code === "Enter" || e.code === "Space")) beginGame(0);
  if (G.mode === "card" && (e.code === "Enter" || e.code === "Space")) closeCard();
});

function beginGame(i) {
  document.getElementById("title").classList.remove("show");
  playBgm();
  G.flags.beck = i > 3;
  if (i === 0) {
    G.items = [];
    G.revealed = { tao: false, old: false };
    G.flags.beck = false;
  }
  enter(i, true);
}

try {
  if (localStorage.getItem("changlu-scene")) document.getElementById("cont").style.display = "inline-block";
} catch (e) {}

requestAnimationFrame(loop);
</script>
</body>
</html>
